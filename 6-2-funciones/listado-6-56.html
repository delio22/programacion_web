<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-56: Enviando el valor de una variable a una función</title>
</head>
<body>
  <script>
    var contador = 100;
    function mifuncion(valor) {
      alert(valor);
    }
    mifuncion(contador);
  </script>
</body>
</html>
