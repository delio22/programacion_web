<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-60: Declarando funciones anónimas</title>
</head>
<body>
  <script>
    var mifuncion = function(valor) {
      valor = valor * 2;
      return valor;
    };
    var total = 2;
    for (var f = 0; f < 10; f++) {
      total = mifuncion(total);
    }
    alert("El total es " + total);  // "El total es 2048"
  </script>
</body>
</html>
