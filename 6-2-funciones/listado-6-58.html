<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-58: Devolviendo valores desde funciones</title>
</head>
<body>
  <script>
    var contador = 100;
    var items = 5;
    function mifuncion(valor1, valor2) {
      var total = valor1 + valor2;
      return total;
    }
    var resultado = mifuncion(contador, items);
    alert(resultado);
  </script>
</body>
</html>
