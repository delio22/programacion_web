<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-62: Comprobando si un valor es un número o no</title>
</head>
<body>
  <script>
    var mivalor = "Hola";
    if (isNaN(mivalor)) {
      alert(mivalor + " no es un número");
    } else {
      alert(mivalor + " es un número");
    }
  </script>
</body>
</html>
