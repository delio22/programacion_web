<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-51: Procesando datos con funciones</title>
</head>
<body>
  <script>
    var total = 5;
    function calcularValores(){
      total = total * 2;
    }
    for(var f = 0; f < 10; f++){
      calcularValores();
    }
    alert("El total es: " + total);  // "El total es: 5120"
  </script>
</body>
</html>
