<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-53: Declarando dos variables con el mismo nombre</title>
</head>
<body>
  <script>
    var mivariable = 5;
    function mifuncion(){
      var mivariable = "Esta es una variable local";
      alert(mivariable);
    }
    mifuncion();
    alert(mivariable);
  </script>
</body>
</html>
