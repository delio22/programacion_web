<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-61: Ejecutando funciones anónimas</title>
</head>
<body>
  <script>
    var mivalor = function(valor) {
      valor = valor * 2;
      return valor;
    }(35);
    alert("El valor es " + mivalor);  // "El valor es 70"
  </script>
</body>
</html>
