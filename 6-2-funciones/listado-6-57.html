<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-57: Enviando múltiples valores a la función</title>
</head>
<body>
  <script>
    var contador = 100;
    var items = 5;

    function mifuncion(valor1, valor2) {
      var total = valor1 + valor2;
      alert(total);  // 105
    }
    mifuncion(contador, items);
  </script>
</body>
</html>
