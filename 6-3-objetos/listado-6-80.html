<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-80: Creando objetos a partir de otros objetos</title>
</head>
<body>
  <script>
    var miobjeto = {
      nombre: "Juan",
      edad: 30,
      mostrarnombre: function(){
        alert(this.nombre);
      },
      cambiarnombre: function(nombrenuevo){
        this.nombre = nombrenuevo;
      }
    };
    var empleado = Object.create(miobjeto);
    empleado.cambiarnombre('Roberto');
    empleado.mostrarnombre();  // "Roberto"
    miobjeto.mostrarnombre();  // "Juan"
  </script>
</body>
</html>
