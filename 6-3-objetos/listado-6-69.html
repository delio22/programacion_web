<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-69: Actualizando valores y agregando nuevas propiedades a un objeto</title>
</head>
<body>
  <script>
    var miobjeto = {
      nombre: "Juan",
      edad: 30
    };
    miobjeto.nombre = "Martín";
    miobjeto.trabajo = "Programador";
    alert(miobjeto.nombre + " " + miobjeto.edad + " " + miobjeto.trabajo);
  </script>
</body>
</html>
