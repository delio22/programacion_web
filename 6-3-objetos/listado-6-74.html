<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-74: Usando un constructor para crear un objeto</title>
</head>
<body>
  <script>
    var constructor = function() {
      var obj = {
        nombre: "Juan",
        edad: 30,
        mostrarnombre: function() {
      alert(this.nombre);
        },
        cambiarnombre: function(nombrenuevo) {
      this.nombre = nombrenuevo;
        }
      };
      return obj;
    };
    var empleado = constructor();
    empleado.mostrarnombre();  // "Juan"
  </script>
</body>
</html>
