<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-67: Accediendo propiedades usando variables</title>
</head>
<body>
  <script>
    var nombrePropiedad = "nombre";
    var miobjeto = {
      nombre: "Juan",
      edad: 30
    };
    alert(miobjeto[nombrePropiedad]);  // "Juan"
  </script>
</body>
</html>
