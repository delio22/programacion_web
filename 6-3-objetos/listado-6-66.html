<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-66: Accediendo propiedades</title>
</head>
<body>
  <script>
    var miobjeto = {
      nombre: "Juan",
      edad: 30
    };
    var mensaje = "Mi nombre es " + miobjeto.nombre + "\r\n";
    mensaje += "Tengo " + miobjeto["edad"] + " años";
    alert(mensaje);
  </script>
</body>
</html>
