<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-73: Referenciando las propiedades del objeto con la palabra clave this</title>
</head>
<body>
  <script>
    var miobjeto = {
      nombre: "Juan",
      edad: 30,
      mostrardatos: function() {
        var mensaje = "Nombre: " + this.nombre + "\r\n";
        mensaje += "Edad: " + this.edad;
        alert(mensaje);
      },
      cambiarnombre: function(nombrenuevo) {
     var nombreviejo = this.nombre;
     this.nombre = nombrenuevo;
        return nombreviejo;
      }
    };
    var anterior = miobjeto.cambiarnombre("José");
    alert("El nombre anterior era: " + anterior);  // "Juan"
  </script>
</body>
</html>
