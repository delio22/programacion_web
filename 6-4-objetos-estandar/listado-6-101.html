<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-101: Reemplazando textos en una cadena de caracteres</title>
</head>
<body>
  <script>
    var texto = "Hola Mundo";
    var textonuevo = texto.replace("Mundo", "Planeta");
    alert(textonuevo);  // "Hola Planeta"
  </script>
</body>
</html>
