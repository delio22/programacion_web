<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-126: Incrementando una fecha</title>
</head>
<body>
  <script>
    var hoy = new Date();
    alert(hoy);  // "Thu Jan 05 2017 14:37:28 GMT-0500 (EST)"
    hoy.setDate(hoy.getDate() + 15);
    alert(hoy);  // "Fri Jan 20 2017 14:37:28 GMT-0500 (EST)"
  </script>
</body>
</html>
