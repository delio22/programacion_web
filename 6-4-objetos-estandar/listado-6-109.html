<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-109: Obteniendo el índice de un valor en el array</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34, 5];
    var indice = lista.indexOf(5);
    alert("El valor " + lista[indice] + " se encuentra en el índice " +
    indice);
  </script>
</body>
</html>
