<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-115: Removiendo valores de un valor</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34];
    var removidos = lista.splice(1, 2);
    alert("Valores restantes: " + lista);  // 12,34
    alert("Valores removidos: " + removidos);  // 5,80
  </script>
</body>
</html>
