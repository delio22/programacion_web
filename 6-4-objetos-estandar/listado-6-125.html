<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-125: Leyendo el mes</title>
</head>
<body>
  <script>
    var hoy = new Date();
    var ano = hoy.getFullYear();
    var mes = hoy.getMonth() + 1;
    var dia = hoy.getDate();
    alert(ano + "-" + mes + "-" + dia);  // "2017-1-5"
  </script>
</body>
</html>
