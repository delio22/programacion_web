<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-116: Agregando valores a un array en una posición específica</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34];
    lista.splice(2, 0, 24, 25, 26);
    alert(lista);  // 12,5,24,25,26,80,34
  </script>
</body>
</html>
