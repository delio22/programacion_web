<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-108: Creando una cadena de caracteres con los valores de un array</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34];
    var mensaje = lista.join("-");
    alert(mensaje);  // "12-5-80-34"
  </script>
</body>
</html>
