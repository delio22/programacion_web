<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-110: Buscando múltiples valores en un array</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34, 5];
    var buscar = 5;
    var ultimo = 0;
    var contador = 0;
    while (ultimo >= 0) {
      var ultimo = lista.indexOf(5, ultimo);
     if (ultimo != -1) {
      ultimo++;
      contador++;
      }
    }
    alert("Hay un total de " + contador + " números " + buscar);
  </script>
</body>
</html>
