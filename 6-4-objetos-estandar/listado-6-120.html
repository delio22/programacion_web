<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-120: Procesando los valores y almacenando los resultados</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34];
    var listanueva = lista.map(function(valor) {
      return valor * 2;
    });
    alert(listanueva);  // 24,10,160,68
  </script>
</body>
</html>
