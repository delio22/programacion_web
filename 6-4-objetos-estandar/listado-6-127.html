<!DOCTYPE html>

<head>

  <title>Listado 6-127: Calculando un intervalo</title>
</head>
<body>
  <script>
    var hoy = new Date(2017, 0, 5);
    var futuro = new Date(2017, 0, 20);
    var intervalo = futuro - hoy;
    alert(intervalo);  // 1296000000
  </script>
