<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-132: Ejecutando operaciones aritméticas con el objeto Math</title>
</head>
<body>
  <script>
    var cuadrado = Math.sqrt(4);  // 2
    var elevado = Math.pow(2, 2);  // 4
    var maximo = Math.max(cuadrado, elevado);

    alert("El valor más grande es " + maximo);  // "El valor más grande es 4"
  </script>
</body>
</html>
