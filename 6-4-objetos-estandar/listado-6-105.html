<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-105: Filtrando los valores de un array</title>
</head>
<body>
  <script>
    var lista = [12, 5, 80, 34];
    var listanueva = lista.filter(function(valor) {
      if (valor <= 50) {
        return true;
      } else {
        return false;
      }
    });
    alert(listanueva);  // 12, 5, 34
  </script>
</body>
</html>
