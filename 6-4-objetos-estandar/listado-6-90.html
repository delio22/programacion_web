<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-90: Removiendo espacios</title>
</head>
<body>
  <script>
    var texto = "Hola Mundo";
    var mensaje = "";
    for (var f = 0; f < texto.length; f++) {
      mensaje += texto[f] + " ";
    }
    mensaje = mensaje.trim();
    alert(mensaje);  // "H o l a   M u n d o"
  </script>
</body>
</html>
