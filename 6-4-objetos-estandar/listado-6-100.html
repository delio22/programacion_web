<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-100: Encontrando la ubicación de un texto dentro de una cadena de caracteres</title>
</head>
<body>
  <script>
    var texto = "Hola Mundo";
    var posicion = texto.indexOf("Mundo");
    alert("La palabra comienza en el índice " + posicion);  // 5
  </script>
</body>
</html>
