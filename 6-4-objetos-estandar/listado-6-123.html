<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-123: Creando un objeto Date a partir de los componentes de una fecha</title>
</head>
<body>
  <script>
    var fecha = new Date(2017, 1, 15, 12, 35, 0);
    alert(fecha);  // "Wed Feb 15 2017 12:35:00 GMT-0500 (EST)"
  </script>
</body>
</html>
