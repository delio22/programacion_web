<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-89: Iterando sobre los caracteres de una cadena</title>
</head>
<body>
  <script>
    var texto = "Hola Mundo";
    var mensaje = "";
    for (var f = 0; f < texto.length; f++) {
     mensaje += texto[f] + " ";
    }
    alert(mensaje);  // "H o l a   M u n d o "
  </script>
</body>
</html>
