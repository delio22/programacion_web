<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listado 6-122: Creando un objeto Date a partir de un texto</title>
</head>
<body>
  <script>
    var fecha = new Date("January 20 2017");
    alert(fecha);  // "Fri Jan 20 2017 00:00:00 GMT-0500 (EST)"
  </script>
</body>
</html>
